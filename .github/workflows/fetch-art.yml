name: Récupérer les illustrations

# Télécharge les images listées dans art/manifest.txt (nom + lien)
# vers art/src/<nom>.png, puis les ajoute au repo.
# Les liens de génération expirent : une fois l'image dans le repo,
# elle n'en dépend plus.

on:
  push:
    paths:
      - art/manifest.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les images manquantes
        run: |
          mkdir -p art/src
          while read -r name url; do
            [ -z "$name" ] && continue
            f="art/src/$name.png"
            if [ ! -s "$f" ]; then
              echo "→ $name"
              curl -sSfL --retry 3 -o "$f" "$url" || { echo "échec $name"; rm -f "$f"; }
            fi
          done < art/manifest.txt
          ls -la art/src | head -60
      - name: Ajouter au repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add art/src
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Illustrations récupérées"
          git push
